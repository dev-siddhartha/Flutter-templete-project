name: flutter_template
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # for design system
  slds_flutter:
    path: packages/slds_flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.9

  # for env files
  flutter_dotenv: ^6.0.1

  # for localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # responsiveness
  flutter_screenutil: ^5.9.3

  # for dependency injection
  get_it: ^9.2.1
  injectable: ^3.0.0

  # for local storage
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.0.0

  # for state management
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0

  # for handling nested widgets - used in global bloc provider
  nested: ^1.0.0

  # for routing
  go_router: ^18.0.0

  # for api service
  api_request_handler: ^0.1.0
  dio: ^5.11.0

  # functional programming
  fpdart: ^1.2.0

  # utility functions and classes in the style of dart:collection
  collection: ^1.19.1

  # for permission
  permission_handler: ^13.0.1

  # for device info
  device_info_plus: ^13.2.0
  unique_device_identifier: ^2.1.0 # for getting unique identifier. used for assigning fingerprint
  package_info_plus: ^10.2.1 # for getting package name. used for force update

  connectivity_plus: ^7.3.1

  # firebase
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  firebase_crashlytics: ^5.3.0
  flutter_local_notifications: ^22.3.0

  # for local caching (also used to avoid api_request_handler's internal
  # cache leaking into the iOS Files app - see HiveInitializer)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.6

  # for pull-to-refresh + pagination list widget
  pull_to_refresh: ^2.0.0

  # for network image caching - see lib/core/widgets/app_network_image.dart
  cached_network_image: ^3.4.1

  # for biometric (fingerprint/face) auth - see lib/core/services/biometric
  local_auth: ^3.0.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ^2.15.1
  injectable_generator: ^3.1.3

  # app icon / splash screen generation - see flutter_launcher_icons.yaml / flutter_native_splash.yaml
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

  # testing - see docs/testing.md
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  config:
    enable-swift-package-manager: false

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  generate: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - .env.dev
    - .env.prod
    - assets/icon/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # Google Sans - the slds_flutter design system's typeface (see docs/design_system.md).
  # Declared here too (not just in the package) so GlobalTheme's fontFamily and any
  # raw Text/TextStyle outside SldsText also render in Google Sans.
  fonts:
    - family: Google Sans
      fonts:
        - asset: assets/fonts/GoogleSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/GoogleSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/GoogleSans-Bold.ttf
          weight: 700
