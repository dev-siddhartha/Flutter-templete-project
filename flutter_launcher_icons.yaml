# App icon generation config for the flutter_launcher_icons package.
#
# `assets/icon/icon.png` is currently a placeholder (copied from the default Flutter
# mipmap icon) - replace it with your project's real 1024x1024 icon before shipping.
#
# `remove_alpha_ios: true` is deliberately NOT set here - flutter_launcher_icons 0.14.4
# throws a RangeError applying it to this placeholder image. Once you swap in a real,
# opaque source icon you can add `remove_alpha_ios: true` to satisfy the App Store's
# no-alpha-channel requirement (or just flatten alpha out of the source PNG yourself).
#
# To regenerate icons for every platform after changing the source image or this
# config, run:
#   dart run flutter_launcher_icons

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/icon.png"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
  macos:
    generate: true
    image_path: "assets/icon/icon.png"
